# Canonical, shared protocol for ALL methods (yours + baselines)

seeds: [0, 1, 2, 3, 4]   # used everywhere unless overridden

link_prediction:
  negatives_per_pos: 1
  num_eval_negatives: 1000   # per split; sampled fresh per seed
  metrics: [auc, ap]

  transductive:
    # Time windows (naive timestamps as integers)
    # If your dataset loader already provides splits, we'll ignore these.
    train_end:   "t <= T_train_end"     # placeholder; enforced only if you pass a monolithic edge list
    val_window:  "T_train_end < t <= T_val_end"
    test_window: "T_val_end   < t <= T_test_end"
    unseen_nodes_policy: "allow"        # transductive => nodes can appear in train

  inductive:
    # Standard inductive: test contains nodes unseen in train.
    # We enforce by masking test nodes that do not appear in train node set.
    train_end:   "t <= T_train_end"
    val_window:  "T_train_end < t <= T_val_end"
    test_window: "T_val_end   < t <= T_test_end"
    unseen_nodes_policy: "require_unseen"  # strict

node_classification:
  # Two tracks: supervised (canonical labels) AND optional unsupervised (pseudo-labels)
  supervised:
    use_canonical_splits: true
    metrics: [micro_f1, macro_f1, accuracy]
  unsupervised_pseudolabels:
    enabled: false         # set true only if you want this second track
    k: 20                  # default K for KMeans; tuned in grid if needed
    repeats: 5
